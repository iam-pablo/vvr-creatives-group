<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>VVR PORTFOLIO</title>
        <link href="styles.css" rel="stylesheet"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <!-- <script href="app.js"></script> -->
        <script src="script.js"></script>
        <script src="app.js"></script>
        <script async src="//www.instagram.com/embed.js"></script>

    </head>
    <body>
        <!-- Sticky Navigation Bar -->
        <nav class="navbar">
            <div class="nav-container">
                <!-- Logo (optional) -->
                <div class="logo">VVR</div>
                
                <!-- Hamburger Menu (Mobile Only) -->
                <button class="hamburger" aria-label="Menu">
                    <i class="fas fa-bars"></i> <!-- Font Awesome icon -->
                </button>
                
                <!-- Desktop Menu -->
                <div class="nav-links">
                    <a href="index.html#home" class="nav-link">Home</a>
                    <a href="index.html#about-us" class="nav-link">About Us</a>
                    <a href="index.html#portfolio" class="nav-link">Portfolio</a>
                    <a href="index.html#contact-us" class="nav-link">Contact Us</a>
                </div>
            </div>
        </nav>

        <section class="content-wrap" alt="hero" id="home">
            <h1 class="banner">OUR PORTFOLIO</h1>
            <!-- Photography -->
            <section id="photos" class="hide">
                <!-- commercial -->
                <div class='work-container'>
                    <h1>Commercial</h1>
                        <section class="gallery-container" id="commercial" alt="commercial-photos">
                            <div class="gallery-item">
                                <img src="https://live.staticflickr.com/65535/54612964875_e1e45b76cc.jpg" alt="${image.title}">
                            </div>
                        </section>
                </div>
                <!-- events -->
                <div class='work-container'>
                    <h1>Events</h1>
                    <section class="gallery-container" id="event" alt="events-photos">
                    </section>
                </div>
                <!-- weddings -->
                <div class='work-container'>
                    <h1>Weddings</h1>
                    <section class="gallery-container" id="wedding"></section>
                </div>
                <!-- festivals -->
                <div class='work-container'>
                    <h1>Festivals</h1>
                    <section class="gallery-container" id="festival"></section>
                </div>
            </section>

            <!-- Videography -->
            <section id="videos" class="hide">
                <!-- commercial -->
                <div class='work-container'>
                    <h1>Commercial</h1>
                    <section></section>
                </div>
            </section>
        </section>

        
        <footer class="footer">
            <a><img src="/imgs/logo.jpg" class="footer-logo"></a>
            <section class="footer-sm-container">
                <a href=""><i class="fa-brands fa-instagram" style="color:#000000"></i></a>
                <a href=""><i class="fa-brands fa-instagram fa-2xs" style="color:#000000"></i></a>
            </section>
        </footer>
    </body>
</html>
